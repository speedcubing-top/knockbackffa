name: KnockBackFFA
main: top.speedcubing.knockbackffa.original.KnockBackFFA
version: 1.0
depend:
  - speedcubingServer
  - speedcubingLib
commands:
  map:
    usage: /map
  trollutils:
    usage: /trollutils
  killeffect:
    permission: ke.ke
    aliases: [ ke, killeffects ]
  projectileeffect:
    aliases: [ pe ]
  cosmetic:
    aliases: [ cm ]
  debugffa:
    usage: /debugffa <mode>
  profile:
    usage: /profile <player>
  stats:
    usage: /stats <player>
  sendmessage:
    aliases: [ sm ]
    usage: /sendmessage <player> <message>
  killmyself:
    aliases: [ kms ]
    usage: /killmyself
  taggame:
    aliases: [ tg ]
    usage: /taggame
  taggamelist:
    aliases: [ tgl ]
    usage: /taggamelist
  invsee:
    usage: /invsee
  mapview:
    usage: /mapview
  vote:
    usage: /vote
  changemap:
    usage: /changemap
  combo:
    usage: /combo
  setarmorcolor:
    usage: /setarmorcolor
  myworld:
    usage: /myworld
  damagetick:
    usage: /damagetick

